apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: invoice-hub
resources:
  - ../../base
images:
  - name: invoice-hub-web
    newName: registry.example.com/invoice-hub/invoice-hub-web
    newTag: 0.1.0 # 发布时由流水线替换为镜像摘要或版本号
patches:
  - target: { kind: Deployment, name: invoice-hub-web }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
