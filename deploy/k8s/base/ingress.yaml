# 同一域名下：/ → 前端，/api → 业务后端，/agent-api → 统一 agent 平台
# 后端服务名按实际环境修改；示例使用 ingress-nginx
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invoice-hub-web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts: [invoice-hub.example.com]
      secretName: invoice-hub-tls
  rules:
    - host: invoice-hub.example.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: invoice-hub-api
                port: { number: 8080 }
          - path: /agent-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: agent-platform-gateway
                port: { number: 8080 }
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: invoice-hub-web
                port: { name: http }
