apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: invoice-hub-web
      app.kubernetes.io/part-of: inbound-invoice-hub
    includeSelectors: true
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  - name: invoice-hub-web
    newName: registry.example.com/invoice-hub/invoice-hub-web
    newTag: 0.1.0
