# 前端静态站点。/api 与 /agent-api 由 K8s Ingress 转发到后端服务，不经过本容器。
# 如需由本容器反代（无 Ingress 的环境），取消下方 location /api 注释并改为实际服务地址。
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 运行时配置：不缓存
  location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # 带哈希的构建产物：长缓存
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA：其余路径回落到 index.html（index.html 本身不缓存）
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # location /api/ {
  #   proxy_pass http://invoice-hub-api.invoice-hub.svc.cluster.local:8080/;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  # }
}
