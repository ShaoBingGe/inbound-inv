# 安全响应头。nginx 的 add_header 在 location 内会覆盖上级配置，所以每个 location 都 include 本文件。
# CSP 的 connect-src 需包含 IdP 与 API 域名（默认允许同源与任意 https，生产可收紧为具体域名）。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https:" always;
